<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>G Chat API 诊断</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:24px;background:#f6f3ef;color:#222}main{max-width:680px;margin:auto}h1{font-size:24px}label{display:block;margin:16px 0 6px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font:inherit;background:white}textarea{min-height:110px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#222;color:white;font-size:16px}#log{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:18px;min-height:120px;font-family:ui-monospace,monospace;font-size:13px;line-height:1.5}#answer{white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:12px;min-height:60px}.hint{font-size:13px;color:#666;line-height:1.5}</style></head><body><main><h1>G Chat API 诊断版</h1><p class="hint">这个页面不注册 Service Worker、不使用原 App 的 api.js/app.js，只测试一次最简单的 DeepSeek 请求。</p><label>Base URL</label><input id="base" value="https://api.deepseek.com"><label>API Key</label><input id="key" type="password" placeholder="粘贴你的 DeepSeek API Key"><label>Model</label><input id="model" value="deepseek-chat"><label>测试内容</label><textarea id="text">你好，请回复“API连接成功”。</textarea><button id="send">发送测试请求</button><div id="log">等待测试……</div><div id="answer"></div></main><script>const $=id=>document.getElementById(id);const log=s=>{$('log').textContent+=`\n${new Date().toLocaleTimeString()}  ${s}`};$('send').onclick=async()=>{const base=$('base').value.trim().replace(/\/+$/,'');const key=$('key').value.trim();const model=$('model').value.trim();const text=$('text').value;if(!key){$('log').textContent='请先填写 API Key';return} $('log').textContent='开始测试';$('answer').textContent='';$('send').disabled=true;const url=base+'/chat/completions';log('请求地址：'+url);log('准备发送 POST');const controller=new AbortController();const timer=setTimeout(()=>{log('超过 60 秒仍未收到响应，主动中止请求');controller.abort()},60000);try{const body={model:model,messages:[{role:'user',content:text}],temperature:.7,stream:false};log('请求体：'+JSON.stringify(body));const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body),signal:controller.signal});clearTimeout(timer);log('收到 HTTP 响应：'+response.status+' '+response.statusText);const raw=await response.text();log('响应长度：'+raw.length);if(!response.ok){$('answer').textContent=raw||('HTTP '+response.status);return}try{const data=JSON.parse(raw);const answer=data?.choices?.[0]?.message?.content||'';$('answer').textContent=answer||raw;log('解析成功')}catch(e){$('answer').textContent=raw;log('JSON 解析失败：'+e.message)}}catch(e){clearTimeout(timer);log('FETCH ERROR：'+e.name+' | '+e.message);$('answer').textContent='网络请求失败：'+e.name+' / '+e.message+'\n\n请把上面的完整诊断日志发给我。'}finally{$('send').disabled=false}};</script></body></html>
