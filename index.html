<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6f2ec"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="G Chat">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>G Chat</title><link rel="stylesheet" href="./style.css"></head>
<body><div class="app" id="app"><aside id="drawer" class="drawer"><div class="drawer-top"><div class="brand"><div class="brand-mark" id="brandAvatar">G</div><div><b>G Chat</b><small>私人 AI 對話</small></div></div><button class="round" id="closeDrawer">×</button></div>
<button class="new" id="newChat">＋ 新對話</button><div class="section">對話</div><div id="chatList" class="list"></div><div class="bottom"><button id="openSettings">设置</button><small>聊天记录与个性化资料只保存在这台装置</small></div></aside>
<main class="main"><header><button class="round" id="openDrawer">☰</button><button class="head profileHead" id="openProfile"><span class="headAvatar" id="headAvatar">G</span><span><b id="title">新对话</b><small id="modelName">未設定模型</small></span></button><button class="round" id="headerSettings">⚙</button></header>
<section id="messages" class="messages"></section><div id="error" class="error hidden"></div><footer><div class="composer"><button class="mic" id="mic" title="语音输入">◉</button><textarea id="input" rows="1" placeholder="和 AI 说点什么…"></textarea><button class="send" id="send">↑</button></div><div class="hint">Enter 送出　·　Shift + Enter 换行</div></footer></main></div><div id="shade" class="shade hidden"></div>
<dialog id="settings"><div class="modalhead"><div><b>设置</b><small>API、主题、头像与聊天背景</small></div><button class="round" id="closeSettings">×</button></div><div class="tabs"><button class="tab active" data-tab="apiTab">AI</button><button class="tab" data-tab="lookTab">外观</button><button class="tab" data-tab="chatTab">聊天</button></div>
<div class="tabbody" id="apiTab"><div class="form"><label>API Base URL<input id="apiBase" placeholder="https://api.deepseek.com"></label><label>API Key<input id="apiKey" type="password" placeholder="sk-…"></label><label>模型<select id="modelSelect"></select><input id="model" placeholder="例如 deepseek-chat"><div class="modelrow"><button class="mini" id="addModel">加入常用</button><button class="mini dangerText" id="removeModel">移除当前</button></div></label><label>System Prompt<textarea id="systemPrompt" rows="5" placeholder="你是一个有帮助的助手。"></textarea></label><label>Temperature<input id="temperature" type="number" min="0" max="2" step=".1"></label></div></div>
<div class="tabbody hidden" id="lookTab"><div class="form"><div class="settingTitle">显示名称</div><label>你的昵称<input id="myName" placeholder="你"></label><label>G 的名字<input id="gName" placeholder="G"></label><label>G 的简介<input id="gBio" placeholder="你的私人 AI 对话空间"></label><div class="settingTitle">主题色</div><div class="themeGrid" id="themeGrid"></div><div class="settingTitle">你的头像</div><div class="avatarSetting"><div class="preview userPreview" id="userAvatarPreview">你</div><div><button class="mini" id="uploadUserAvatar">上传头像</button><button class="mini ghost" id="clearUserAvatar">恢复默认</button><input id="userAvatarFile" type="file" accept="image/*" hidden></div></div><div class="settingTitle">AI 头像</div><div class="avatarSetting"><div class="preview aiPreview" id="aiAvatarPreview">G</div><div><button class="mini" id="uploadAiAvatar">上传头像</button><button class="mini ghost" id="clearAiAvatar">恢复默认</button><input id="aiAvatarFile" type="file" accept="image/*" hidden></div></div><div class="settingTitle">聊天背景</div><div class="bgGrid" id="bgGrid"></div><label class="rangeLabel">背景透明度 <output id="bgOpacityOut">18%</output><input id="bgOpacity" type="range" min="0" max="60" value="18"></label><button class="mini full" id="uploadBg">上传背景图片</button><input id="bgFile" type="file" accept="image/*" hidden><button class="mini ghost full" id="clearBg">清除自定义背景</button><div class="settingTitle">气泡样式</div><div class="bubbleGrid" id="bubbleGrid"><button data-bubble="soft">柔和</button><button data-bubble="glass">玻璃</button><button data-bubble="minimal">极简</button><button data-bubble="pill">胶囊</button></div><label class="checkRow"><input id="animations" type="checkbox" checked> <span>启用轻微动画</span></label></div></div>
<div class="tabbody hidden" id="chatTab"><div class="form"><button class="action" id="renameCurrent">重命名当前对话</button><button class="action" id="exportChat">导出当前对话</button><button class="action danger" id="clearCurrent">清空当前对话</button><button class="action danger" id="deleteCurrent">删除当前对话</button><p>长按消息可复制文字。语音输入需要 Safari 支持语音识别。</p></div></div>
<div class="settingsFooter"><button class="save" id="saveSettings">保存设置</button></div></dialog>
<dialog id="profile"><div class="profileModal"><button class="round profileClose" id="closeProfile">×</button><div class="profileAvatar" id="profileAvatar">G</div><h2 id="profileName">G</h2><p id="profileBio">你的私人 AI 对话空间</p><span class="online">● 在线</span><div class="profileStats"><div><small>当前模型</small><b id="profileModel">未设置</b></div><div><small>主题</small><b id="profileTheme">奶油米</b></div></div><button class="save full" id="profileStart">开始聊天</button></div></dialog><div id="bubbleAction" class="bubbleAction hidden"><button id="copyBubble">复制</button></div>
<script src="./app.js"></script></body></html>
