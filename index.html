<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6f2ec"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="G Chat">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>G Chat</title><link rel="stylesheet" href="./style.css"></head>
<body><div class="app"><aside id="drawer" class="drawer"><div class="drawer-top"><div class="brand"><div class="brand-mark">G</div><div><b>G Chat</b><small>私人 AI 對話</small></div></div><button class="round" id="closeDrawer">×</button></div>
<button class="new" id="newChat">＋ 新對話</button><div class="section">對話</div><div id="chatList" class="list"></div><div class="bottom"><button id="openSettings">⚙ API 與聊天設定</button><small>聊天記錄只保存在這台裝置</small></div></aside>
<main class="main"><header><button class="round" id="openDrawer">☰</button><div class="head"><b id="title">新對話</b><small id="modelName">未設定模型</small></div><button class="round" id="headerSettings">⚙</button></header>
<section id="messages" class="messages"></section><div id="error" class="error hidden"></div><footer><div class="composer"><button class="plus" id="quickSettings">＋</button><textarea id="input" rows="1" placeholder="和 AI 說點什麼…"></textarea><button class="send" id="send">↑</button></div><div class="hint">Enter 送出　·　Shift + Enter 換行</div></footer></main></div><div id="shade" class="shade hidden"></div>
<dialog id="settings"><div class="modalhead"><div><b>聊天設定</b><small>OpenAI-compatible API</small></div><button class="round" id="closeSettings">×</button></div><div class="form">
<label>API Base URL<input id="apiBase" placeholder="https://api.deepseek.com"></label><label>API Key<input id="apiKey" type="password" placeholder="sk-…"></label><label>模型<input id="model" placeholder="deepseek-chat"></label><label>System Prompt<textarea id="systemPrompt" rows="5" placeholder="你是一個有幫助的助手。"></textarea></label><label>Temperature<input id="temperature" type="number" min="0" max="2" step=".1"></label>
<button class="save" id="saveSettings">保存設定</button><p>API Key 與聊天記錄會留在本機瀏覽器，不會上傳到本專案伺服器。</p></div></dialog><script src="./app.js"></script></body></html>
