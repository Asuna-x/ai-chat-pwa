<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2ea">
<link rel="manifest" href="manifest.webmanifest">
<title>G Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="聊天列表">☰</button>
    <button class="profile-head" id="profileBtn">
      <img id="headAvatar" alt="">
      <span><b id="headName">G</b><small id="headStatus">● 在线</small></span>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙</button>
  </header>

  <main id="chat" class="chat">
    <div id="empty" class="empty">
      <div class="hero-avatar"><img id="heroAvatar" alt=""></div>
      <h1 id="heroName">G</h1>
      <p id="heroBio">随时都可以来聊聊。</p>
    </div>
  </main>

  <div id="typing" class="typing hidden"><span id="typingAvatar"></span><b>G 正在输入</b><i>•••</i></div>

  <footer class="composer-wrap">
    <div class="composer">
      <button class="mini-btn" id="voiceBtn" title="语音输入">◉</button>
      <textarea id="input" rows="1" placeholder="和 G 聊点什么…"></textarea>
      <button class="send" id="sendBtn">↑</button>
    </div>
  </footer>
</div>

<div class="drawer-backdrop hidden" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><b>聊天</b><button class="icon-btn" id="closeDrawer">×</button></div>
  <button class="new-chat" id="newChat">＋ 新建聊天</button>
  <div id="chatList"></div>
</aside>

<div class="modal hidden" id="settingsModal">
  <div class="sheet">
    <div class="sheet-head"><h2>设置</h2><button class="icon-btn" id="closeSettings">×</button></div>
    <div class="tabs">
      <button class="tab active" data-tab="profile">我的资料</button>
      <button class="tab" data-tab="appearance">外观</button>
      <button class="tab" data-tab="ai">AI</button>
      <button class="tab" data-tab="chatset">聊天</button>
    </div>

    <section class="panel active" data-panel="profile">
      <div class="profile-card">
        <div class="big-avatar"><img id="myAvatarPreview" alt=""></div>
        <div><h3 id="myNamePreview">我</h3><p>你的聊天资料</p></div>
      </div>
      <label>我的昵称<input id="myName" maxlength="30"></label>
      <label>我的头像<input id="myAvatar" type="file" accept="image/*"></label>
      <hr>
      <label>G 的名字<input id="gName" maxlength="30"></label>
      <label>G 的简介<input id="gBio" maxlength="80"></label>
      <label>G 的头像<input id="gAvatar" type="file" accept="image/*"></label>
    </section>

    <section class="panel" data-panel="appearance">
      <h3>主题色</h3><div class="theme-grid" id="themes"></div>
      <h3>聊天背景</h3><div class="bg-grid" id="backgrounds"></div>
      <label>自定义背景图片<input id="chatBg" type="file" accept="image/*"></label>
      <label>背景透明度 <output id="opacityOut">18%</output><input id="bgOpacity" type="range" min="0" max="60" value="18"></label>
      <h3>气泡样式</h3>
      <div class="seg" id="bubbleStyle">
        <button data-v="soft">柔和</button><button data-v="glass">玻璃</button><button data-v="minimal">极简</button><button data-v="pill">胶囊</button>
      </div>
      <label class="toggle"><input id="animations" type="checkbox" checked><span>启用轻微动画</span></label>
    </section>

    <section class="panel" data-panel="ai">
      <label>API Base URL<input id="baseUrl" placeholder="https://api.deepseek.com"></label>
      <label>API Key<input id="apiKey" type="password" placeholder="sk-..."></label>
      <label>模型<input id="model" placeholder="deepseek-chat"></label>
      <label>System Prompt<textarea id="systemPrompt" rows="5"></textarea></label>
      <label>Temperature <output id="tempOut">0.7</output><input id="temperature" type="range" min="0" max="1.5" step="0.1" value="0.7"></label>
      <p class="hint">API Key 仅保存在当前浏览器的本地存储中。</p>
    </section>

    <section class="panel" data-panel="chatset">
      <label>当前聊天名称<input id="chatTitle" maxlength="40"></label>
      <div class="action-row"><button id="renameBtn">保存名称</button><button id="exportBtn">导出当前聊天</button></div>
      <button class="danger" id="clearBtn">清空当前聊天</button>
      <button class="danger" id="deleteBtn">删除当前聊天</button>
    </section>
    <button class="save-btn" id="saveSettings">保存设置</button>
  </div>
</div>

<div class="profile-modal hidden" id="profileModal">
  <div class="profile-sheet">
    <button class="close-float" id="closeProfile">×</button>
    <div class="profile-hero"><img id="profileAvatar" alt=""><h2 id="profileName">G</h2><p id="profileBio">随时都可以来聊聊。</p><span>● 在线</span></div>
    <div class="profile-info"><div><small>当前模型</small><b id="profileModel">未设置</b></div><div><small>主题</small><b id="profileTheme">奶油</b></div></div>
    <button class="save-btn" id="profileChat">开始聊天</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
